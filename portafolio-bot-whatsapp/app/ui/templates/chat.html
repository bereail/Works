<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotisería Doña Pepa · Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}" />
</head>
<body>
  <div class="telefono">
    <header class="encabezado">
      <div class="avatar">🍗</div>
      <div class="info-contacto">
        <span class="nombre">Rotisería Doña Pepa</span>
        <span class="subtitulo" id="subtitulo">en línea</span>
      </div>
      <div class="iconos-header" aria-hidden="true">
        <span>📹</span>
        <span>📞</span>
        <span>⋮</span>
      </div>
    </header>

    <main class="chat" id="chat"></main>

    <form class="barra-envio" id="formulario-envio">
      <button type="button" class="boton-emoji" aria-hidden="true">😊</button>
      <input
        type="text"
        id="entrada-mensaje"
        placeholder="Escribí un mensaje"
        autocomplete="off"
        aria-label="Escribir mensaje"
      />
      <button type="submit" class="boton-enviar" aria-label="Enviar mensaje">➤</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
