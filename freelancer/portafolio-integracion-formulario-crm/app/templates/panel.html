<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel CRM — Nimbus Consultora</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

  <header class="panel-header">
    <h1>Panel de gestión de leads</h1>
    <a class="enlace-landing" href="/">← Ver formulario público</a>
  </header>

  <main class="panel-contenido">
    <section class="kpis" id="kpis">
      <div class="kpi total">
        <div class="etiqueta">Total</div>
        <div class="valor" id="kpi-total">0</div>
      </div>
      <div class="kpi nuevo">
        <div class="etiqueta">Nuevo</div>
        <div class="valor" id="kpi-nuevo">0</div>
      </div>
      <div class="kpi contactado">
        <div class="etiqueta">Contactado</div>
        <div class="valor" id="kpi-contactado">0</div>
      </div>
      <div class="kpi convertido">
        <div class="etiqueta">Convertido</div>
        <div class="valor" id="kpi-convertido">0</div>
      </div>
      <div class="kpi descartado">
        <div class="etiqueta">Descartado</div>
        <div class="valor" id="kpi-descartado">0</div>
      </div>
    </section>

    <div class="barra-herramientas">
      <div class="buscador">
        <span class="icono-lupa">🔍</span>
        <input type="search" id="buscador" placeholder="Buscar por nombre o email...">
      </div>
      <span class="contador-resultados" id="contador-resultados"></span>
    </div>

    <div class="tabla-contenedor">
      <table class="tabla-leads">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Origen</th>
            <th>Fecha</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
      <p class="mensaje-vacio" id="mensaje-vacio" style="display: none;">
        No se encontraron leads con ese criterio de búsqueda.
      </p>
    </div>
  </main>

  <div class="toast" id="toast">
    <span class="icono-toast">✓</span>
    <span id="texto-toast">Estado actualizado</span>
  </div>

  <script>
    const ESTADOS = {{ estados | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/panel.js') }}"></script>
</body>
</html>
