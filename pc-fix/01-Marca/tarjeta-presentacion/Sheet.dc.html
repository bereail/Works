<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .sheet {
      width: 794px;
      height: 1123px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .label {
      font-size: 12px;
      color: #9a9a9a;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 321px);
      grid-template-rows: repeat(3, 208px);
      gap: 24px;
    }
    .slot {
      width: 321px;
      height: 208px;
      outline: 1px dashed #b7b7b7;
      outline-offset: 3px;
    }
  </style>
</helmet>
<div class="sheet">
  <div class="label">PC FIX INFORMÁTICA — hoja para imprimir · cortar por la línea punteada</div>
  <div class="grid">
    <div class="slot"><dc-import name="Card" hint-size="321,208"></dc-import></div>
    <div class="slot"><dc-import name="Card" hint-size="321,208"></dc-import></div>
    <div class="slot"><dc-import name="Card" hint-size="321,208"></dc-import></div>
    <div class="slot"><dc-import name="Card" hint-size="321,208"></dc-import></div>
    <div class="slot"><dc-import name="Card" hint-size="321,208"></dc-import></div>
    <div class="slot"><dc-import name="Card" hint-size="321,208"></dc-import></div>
  </div>
</div>
</x-dc>
</body>
</html>
