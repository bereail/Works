<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .card {
      width: 321px;
      height: 208px;
      background: #060606;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-sizing: border-box;
    }
    .brandRow { display: flex; align-items: baseline; gap: 6px; }
    .brandMark {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 17px;
      color: #b6ff3c;
      letter-spacing: -0.5px;
    }
    .brandName {
      font-weight: 700;
      font-size: 23px;
      letter-spacing: 0.2px;
      color: #ffffff;
      line-height: 1;
    }
    .brandSub {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #c9c9c9;
      margin-top: 3px;
    }
    .divider { height: 1px; background: #b6ff3c; opacity: 0.7; margin: 10px 0; }
    .services { display: flex; flex-direction: column; gap: 5px; }
    .svcRow { display: flex; align-items: center; gap: 7px; }
    .svcIcon { flex: none; width: 15px; height: 15px; color: #b6ff3c; }
    .svcLabel { font-size: 12.5px; font-weight: 500; color: #f1f1f1; line-height: 1; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .cta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #060606;
      background: #b6ff3c;
      border-radius: 3px;
      padding: 5px 8px;
      white-space: nowrap;
    }
    .contact {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: flex-end;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #e8e8e8;
      line-height: 1.2;
    }
    .contact .row { display: flex; align-items: center; gap: 4px; }
    .contact .ic { width: 11px; height: 11px; flex: none; color: #b6ff3c; }
    .contact .at { color: #b6ff3c; font-weight: 600; }
  </style>
</helmet>
<div class="card">
  <div>
    <div class="brandRow">
      <div class="brandMark">&lt;/&gt;</div>
      <div class="brandName">PC FIX</div>
    </div>
    <div class="brandSub">INFORMÁTICA</div>
  </div>

  <div class="divider"></div>

  <div class="services">
    <div class="svcRow">
      <svg class="svcIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L3 18l3 3 6.1-6.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2-2z"></path></svg>
      <div class="svcLabel">Armado de PC y upgrade de hardware</div>
    </div>
    <div class="svcRow">
      <svg class="svcIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M2 20h20"></path></svg>
      <div class="svcLabel">Reparación de PC y notebooks</div>
    </div>
    <div class="svcRow">
      <svg class="svcIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M9.5 12l1.8 1.8L15 10"></path></svg>
      <div class="svcLabel">Formateo y limpieza de virus</div>
    </div>
  </div>

  <div class="footer">
    <div class="cta">PRESUPUESTO SIN CARGO</div>
    <div class="contact">
      <div class="row">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.2z"></path></svg>
        <span>3413184829</span>
      </div>
      <div class="row">
        <span class="at">@</span><span>pcfix.informatica</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
