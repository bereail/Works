<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; font-family: 'Segoe UI', Arial, sans-serif; }
  .lienzo {
    width: 1080px; height: 1080px;
    background: linear-gradient(155deg, {{ color_primario }} 0%, {{ color_acento }} 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px; color: #ffffff;
  }
  .marca { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; opacity: 0.95; }
  .contenido { display: flex; flex-direction: column; gap: 28px; }
  .titular { font-size: 68px; font-weight: 800; line-height: 1.08; }
  .subtitulo { font-size: 34px; font-weight: 400; line-height: 1.3; opacity: 0.92; max-width: 820px; }
  .pie { display: flex; justify-content: space-between; align-items: flex-end; }
  .cta {
    display: inline-block; background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.65);
    border-radius: 999px; padding: 18px 34px; font-size: 28px; font-weight: 600;
  }
  .tagline { font-size: 22px; opacity: 0.8; font-style: italic; }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="marca">{{ nombre_comercial }}</div>
    <div class="contenido">
      <div class="titular">{{ titular }}</div>
      {% if subtitulo %}<div class="subtitulo">{{ subtitulo }}</div>{% endif %}
    </div>
    <div class="pie">
      <div class="tagline">{{ tagline }}</div>
      {% if cta %}<div class="cta">{{ cta }}</div>{% endif %}
    </div>
  </div>
</body>
</html>
