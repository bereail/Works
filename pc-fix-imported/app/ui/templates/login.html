<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ingresar — PCfix Automation Center</title>
<link rel="stylesheet" href="/static/estilos.css" />
</head>
<body>
<div class="pantalla-login">
  <div class="tarjeta-login fade-in">
    <h1>PCfix Automation Center</h1>
    <p>Centro de gestión y automatización de marketing.</p>

    {% if error %}<div class="mensaje-error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <div class="campo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required />
      </div>
      <button type="submit" class="boton boton-primario" style="width:100%; justify-content:center;">Ingresar</button>
    </form>
  </div>
</div>
</body>
</html>
