<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; font-family: 'Segoe UI', Arial, sans-serif; }

  .lienzo {
    width: 1080px; height: 1080px;
    background:
      radial-gradient(circle at 85% 10%, rgba(46,232,94,0.14) 0%, transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(46,232,94,0.08) 0%, transparent 40%),
      {{ color_primario }};
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px; color: #ffffff; position: relative; overflow: hidden;
  }

  /* líneas tipo circuito, sutiles */
  .lienzo::before {
    content: ""; position: absolute; inset: 0; opacity: 0.05;
    background-image:
      repeating-linear-gradient(90deg, {{ color_acento }} 0px, {{ color_acento }} 1px, transparent 1px, transparent 96px),
      repeating-linear-gradient(0deg, {{ color_acento }} 0px, {{ color_acento }} 1px, transparent 1px, transparent 96px);
  }

  .marca { display: flex; align-items: center; gap: 12px; z-index: 1; }
  .marca .icono-marca {
    width: 46px; height: 46px; border-radius: 10px; border: 2px solid {{ color_acento }};
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .marca .nombre { font-size: 24px; font-weight: 800; letter-spacing: 0.3px; }

  .contenido { display: flex; flex-direction: column; gap: 24px; z-index: 1; }
  .titular {
    font-size: 66px; font-weight: 900; line-height: 1.08; letter-spacing: -0.5px;
    color: {{ color_acento }};
    text-shadow: 0 0 28px rgba(46,232,94,0.55);
  }
  .subtitulo { font-size: 30px; font-weight: 400; line-height: 1.35; color: #d7dcd9; max-width: 820px; }

  .pie { display: flex; justify-content: space-between; align-items: flex-end; z-index: 1; }
  .cta {
    display: inline-block; background: {{ color_acento }}; color: #05130a;
    border-radius: 999px; padding: 18px 34px; font-size: 26px; font-weight: 800;
  }
  .tagline { font-size: 20px; color: #8b968f; font-style: italic; }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="marca">
      <div class="icono-marca">💻</div>
      <div class="nombre">{{ nombre_comercial }}</div>
    </div>
    <div class="contenido">
      <div class="titular">{{ titular }}</div>
      {% if subtitulo %}<div class="subtitulo">{{ subtitulo }}</div>{% endif %}
    </div>
    <div class="pie">
      <div class="tagline">{{ tagline }}</div>
      {% if cta %}<div class="cta">{{ cta }}</div>{% endif %}
    </div>
  </div>
</body>
</html>
