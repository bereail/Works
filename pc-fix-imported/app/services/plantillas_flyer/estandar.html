<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; font-family: 'Segoe UI', Arial, sans-serif; }

  .lienzo {
    width: 1080px; height: 1350px;
    background: {{ color_primario }};
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 80px 76px; color: #ffffff; position: relative; overflow: hidden;
  }

  .marca-agua {
    position: absolute; right: -60px; bottom: 60px; z-index: 0;
    font-family: 'Consolas', 'Courier New', monospace; font-weight: 700;
    font-size: 340px; line-height: 1; color: {{ color_acento }}; opacity: 0.06;
    pointer-events: none; user-select: none;
  }

  .marca { display: flex; align-items: center; gap: 14px; z-index: 1; }
  .marca .icono-marca {
    width: 52px; height: 52px; border-radius: 10px; border: 2.5px solid {{ color_acento }};
    display: flex; align-items: center; justify-content: center;
    font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 20px; color: {{ color_acento }};
  }
  .marca .nombre { font-size: 22px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; }
  .marca .nombre .acento { color: {{ color_acento }}; }

  .contenido { display: flex; flex-direction: column; justify-content: center; flex: 1; gap: 28px; z-index: 1; max-width: 900px; }
  .titular {
    font-size: 66px; font-weight: 800; line-height: 1.12; letter-spacing: -0.5px;
    text-transform: uppercase; color: #ffffff;
  }
  .subtitulo { font-size: 29px; font-weight: 400; line-height: 1.4; color: #c7ccc9; max-width: 820px; }

  .pie { display: flex; flex-direction: column; gap: 22px; z-index: 1; }
  .ubicacion { font-size: 20px; color: #8b968f; }
  .cta {
    align-self: flex-start; background: {{ color_acento }}; color: #05130a;
    border-radius: 999px; padding: 20px 38px; font-size: 26px; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="marca-agua">&lt;/&gt;</div>
    <div class="marca">
      <div class="icono-marca">&lt;/&gt;</div>
      <div class="nombre">PC <span class="acento">FIX</span></div>
    </div>
    <div class="contenido">
      <div class="titular">{{ titular }}</div>
      {% if subtitulo %}<div class="subtitulo">{{ subtitulo }}</div>{% endif %}
    </div>
    <div class="pie">
      <div class="ubicacion">📍 Rosario · Presupuesto sin cargo</div>
      {% if cta %}<div class="cta">{{ cta }}</div>{% endif %}
    </div>
  </div>
</body>
</html>
